# Active only while Samatha advertises its current mode in this Kitty window.
# Browse mode uses terminal font zoom; edit mode changes the saved note font.
map --when-focus-on var:samatha=browser ctrl+equal change_font_size current +1.0
map --when-focus-on var:samatha=browser ctrl+plus change_font_size current +1.0
map --when-focus-on var:samatha=browser ctrl+shift+equal change_font_size current +1.0
map --when-focus-on var:samatha=browser ctrl+shift+plus change_font_size current +1.0
map --when-focus-on var:samatha=browser ctrl+kp_add change_font_size current +1.0
map --when-focus-on var:samatha=browser ctrl+minus change_font_size current -1.0
map --when-focus-on var:samatha=browser ctrl+shift+minus change_font_size current -1.0
map --when-focus-on var:samatha=browser ctrl+kp_subtract change_font_size current -1.0
map --when-focus-on var:samatha=browser ctrl+0 change_font_size current 0

map --when-focus-on var:samatha=editor ctrl+equal send_text all \x1b[61;5u
map --when-focus-on var:samatha=editor ctrl+plus send_text all \x1b[43;5u
map --when-focus-on var:samatha=editor ctrl+shift+equal send_text all \x1b[61;5u
map --when-focus-on var:samatha=editor ctrl+shift+plus send_text all \x1b[43;5u
map --when-focus-on var:samatha=editor ctrl+kp_add send_text all \x1b[43;5u
map --when-focus-on var:samatha=editor ctrl+minus send_text all \x1b[45;5u
map --when-focus-on var:samatha=editor ctrl+shift+minus send_text all \x1b[45;5u
map --when-focus-on var:samatha=editor ctrl+kp_subtract send_text all \x1b[45;5u
map --when-focus-on var:samatha=editor ctrl+0 send_text all \x1b[48;5u
